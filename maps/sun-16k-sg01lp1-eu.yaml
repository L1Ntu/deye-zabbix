    scale: 0.1
    type: U_WORD

  total_energy_sold:
    name: Total Energy Sold
    address: 81
    unit: kWh
    scale: 0.1
    type: U_WORD


  ####### AUX / GEN #######

  aux_power:
    name: AUX Power
    address: 166
    unit: W
    scale: 1
    type: S_WORD


  ####### GRID #######

  grid_voltage_l1:
    name: Grid Voltage L1
    address: 150
    unit: V
    scale: 0.1
    type: U_WORD

  grid_voltage_l2:
