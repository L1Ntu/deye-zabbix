registers:

  ####### GENERAL #######

  serial:
    name: Serial Number
    address: 3
    unit: ''
    type: SERIAL

  state:
    name: Overal State
    address: 59
    unit: ''
    scale: 1
    type: S_WORD
    note: '0 - standby ; 1 - selftest ; 2 - normal ; 3 - alarm ; 4 - fault'


  ####### SOLAR #######

  pv1_power:
    name: PV1 Power
    address: 186
    unit: W
    scale: 1
    type: U_WORD

  pv2_power:
