registers:

  ####### GENERAL #######

  serial:
    name: Inverter Serial
    address:
      list: [3, 4, 5, 6, 7]
    unit: ''
    type: SERIAL

  state:
    name: Inverter State
    address: 59
    unit: ''
    scale: 1
    type: S_WORD
    options:
      0: standby
      1: selftest
      2: normal
      3: alarm
      4: fault


  ####### SOLAR #######

  pv1_power:
    name: PV1 Power
    address: 186
    unit: W
    scale: 1
    type: U_WORD

  pv2_power:
    name: PV2 Power
    address: 187
    unit: W
    scale: 1
    type: U_WORD

  pv1_voltage:
    name: PV1 Voltage
    address: 109
    unit: V
    scale: 0.1
    type: U_WORD

  pv2_voltage:
    name: PV2 Voltage
    address: 111
    unit: V
    scale: 0.1
    type: U_WORD

  pv1_current:
    name: PV1 Current
    address: 110
    description: Photovoltaic 1 current
    unit: A
    scale: 0.1
    type: U_WORD

  pv2_current:
    name: PV2 Current
    address: 112
    unit: A
    scale: 0.1
    type: U_WORD


  ####### ENERGY #######

  today_production:
