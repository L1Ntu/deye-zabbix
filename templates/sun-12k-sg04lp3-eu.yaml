zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 3bac9014f51d4383a238feffbac3112e
      name: Templates
  templates:
    - uuid: 6565c7059896404b857eb903d42499de
      template: DEYE-12K-SG04LP3-EU
      name: Deye 12K-SG04LP3-EU Inverter
      description: 'Template for monitoring Deye hybrid inverter 12K-SG04LP3-EU'
      groups:
        - name: Templates
      items:
        # Raw data collection
        - uuid: 5591703bb6764107893fb9e5040425d1
          name: 'Raw Data'
          key: 'deye.12k-sg04lp3'
          value_type: TEXT
          description: 'Raw JSON data from Python script'
          delay: '60'
          history: 1d
          triggers:
            - uuid: e7535d2a504848bab06781ab4ea134ba
              name: 'No data from inverter for 5 minutes'
              expression: 'nodata(/DEYE-12K-SG04LP3-EU/deye.12k-sg04lp3,5m)=1'
              priority: AVERAGE
              description: 'Cannot fetch data from Deye inverter'
              manual_close: YES

        # General Data
        - uuid: f4eedd34861d42e8a894f954a67d719b
          name: 'Serial Number'
          type: DEPENDENT
          key: 'deye.sg04lp3.serial'
          value_type: TEXT
          description: 'Device Serial Number'
          master_item:
            key: 'deye.12k-sg04lp3'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data.serial.value'

        - uuid: 36b99ca22245487091b977aa0c7ab1ee
          name: 'Overall State'
          type: DEPENDENT
          key: 'deye.sg04lp3.state'
          value_type: UNSIGNED
          description: 'Device State (0=standby, 1=selftest, 2=normal, 3=alarm, 4=fault)'
          valuemap:
            name: 'Deye State'
          master_item:
            key: 'deye.12k-sg04lp3'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data.state.value'

