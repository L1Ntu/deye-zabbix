zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 3bac9014f51d4383a238feffbac3112e
      name: Templates
  templates:
    - uuid: c33a2416205d456a8d7be8f8cc2263f2
      template: DEYE-16K-SG01LP1-EU
      name:  Deye 16K-SG01LP1-EU Inverter
      description: 'Template for monitoring Deye hybrid inverter 16K-SG01LP1-EU'
      groups:
        - name: Templates
      items:
        # Raw data collection
        - uuid: 9cf84c9519db4ff59a2d98774e26c323
          name: 'Raw Data'
          key: 'deye.16k-sg01lp1'
          value_type: TEXT
          description: 'Raw JSON data from Python script'
          delay: '60'
          history: 1d
          triggers:
            - uuid: a1b2c3d4e5f6471489abcdef01234567
              name: 'No data from inverter for 5 minutes'
              expression: 'nodata(/DEYE-16K-SG01LP1-EU/deye.16k-sg01lp1,5m)=1'
              priority: AVERAGE
              description: 'Cannot fetch data from Deye inverter'
              manual_close: YES

        # General Data
        - uuid: 7e43d4e6f8f749b1835225362987c88b
          name: 'Serial Number'
          type: DEPENDENT
          key: 'deye.sg01lp1.serial'
          value_type: TEXT
          description: 'Device Serial Number'
          master_item:
            key: 'deye.16k-sg01lp1'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data.serial.value'

        - uuid: ba87f7efc3dc479b8bc770fb9b67041f
          name: 'Overall State'
          type: DEPENDENT
          key: 'deye.sg01lp1.state'
          value_type: UNSIGNED
          description: 'Device State (0=standby, 1=selftest, 2=normal, 3=alarm, 4=fault)'
          valuemap:
            name: 'Deye State'
          master_item:
            key: 'deye.16k-sg01lp1'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data.state.value'

        # PV Data
        - uuid: 77366ef9cfe54f8cbae99ab8235bba42
